name: Build and Deploy OCI Image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: vthiery/steampipe-plugin-build-push-action@46afca64022517e4f3ed8b7c238e492d54a8d8ba
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
